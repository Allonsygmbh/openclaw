name: Release fork tarball

on:
  push:
    tags:
      - "clawy-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to (re)build from"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Pack step can take 15+ minutes when bundleDependencies covers
    # 70+ packages and the upstream codebase has grown. Default 30 min
    # timeout was too tight for 4.27. Bumped to 60 min with margin.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        # Read pnpm version from package.json's `packageManager` field so
        # we don't have to bump this workflow every time upstream updates
        # pnpm. The action picks it up automatically when `version` is
        # omitted.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist + UI
        run: |
          pnpm build
          pnpm ui:build

      - name: Apply Clawy IPI + JITI memoize patches
        # Two memoization patches that take dispatch on a 2 GB Hetzner cx23
        # from ~280s → ~70s with 121 bundled plugins:
        #   1. loadInstalledPluginIndex memoize — runtime rebuilds the
        #      bundled-plugin index 60+ times per dispatch over the same
        #      effective inputs.
        #   2. registerBundledRuntimeDependencyJitiAliases memoize — re-walks
        #      every bundled plugin's package.json + transitive dep tree on
        #      every plugin load.
        # See scripts/clawy-patch-ipi-memoize.mjs. Idempotent, content-based
        # match (chunk filenames rotate between releases). Drop this step
        # when upstream memoizes natively.
        run: node scripts/clawy-patch-ipi-memoize.mjs dist

      - name: Write Clawy release marker
        # Drops a small JSON marker into dist/ identifying the fork tag.
        # The CLI on each VM reads this at metrics-push time, so the
        # admin UI can show "this VM is on clawy-2026.4.12-beta.1-1"
        # rather than just "fork build". Upstream tarballs don't have
        # this file, so its absence also signals upstream cleanly.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          COMMIT="$(git rev-parse HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > dist/clawy-release.json <<EOF
          {
            "tag": "${TAG}",
            "commit": "${COMMIT}",
            "built_at": "${BUILT_AT}"
          }
          EOF
          cat dist/clawy-release.json

      - name: Install bundled plugin runtime deps
        # scripts/postinstall-bundled-plugins.mjs discovers each bundled
        # plugin's declared runtime deps (from dist/extensions/*/package.json)
        # and installs the missing ones into <root>/node_modules/ via npm.
        # Normally this runs at `npm install -g` time on the target VM,
        # but on 2 GB VMs that's a 4-minute npm install for ~36 plugin
        # deps. Run it once here in CI — node_modules ends up with all
        # the plugin deps, and the next step bundles them into the tarball.
        run: node scripts/postinstall-bundled-plugins.mjs

      - name: Bundle all runtime dependencies (main + plugin deps)
        # `npm install -g <tarball>` on low-memory VMs (2 GB Hetzner base)
        # gets OOM-killed because npm resolves + fetches all 70+ deps at
        # install time, peaking at ~1.6 GB RSS. Pre-populate
        # bundleDependencies with every key from `dependencies` + every
        # plugin-declared dep so every runtime dep ships inside the
        # tarball; install-time becomes a pure extract + bin-link with
        # near-zero memory pressure AND no postinstall npm install.
        # Run AFTER postinstall-bundled-plugins (so node_modules has the
        # plugin deps) and BEFORE pack so pnpm pack picks up the mutated
        # field. The edit is CI-only, not committed.
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const { discoverBundledPluginRuntimeDeps } =
              await import('./scripts/postinstall-bundled-plugins.mjs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const main = Object.keys(p.dependencies || {});
            const plugin = discoverBundledPluginRuntimeDeps().map(d => d.name);
            p.bundleDependencies = [...new Set([...main, ...plugin])].sort();
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('bundleDependencies count:', p.bundleDependencies.length, '(main:', main.length, 'plugin:', plugin.length + ')');
          "

      - name: Pack tarball (npm pack + Python hardlink dereferencer)
        env:
          # Tells the prepack hook to skip rebuilding and just verify
          # that the dist/ we produced above is intact.
          OPENCLAW_PREPACK_PREPARED: "1"
        # `pnpm pack` hangs forever on the ~200-entry bundleDependencies
        # array we synthesize for 4.27's 119 bundled extensions — pnpm
        # tries to reconcile its own lockfile against npm-rooted
        # node_modules and never returns.
        #
        # `npm pack` produces a working tarball IN ITS OWN FORMAT, but it
        # writes HARDLINKS for content-deduplicated files. Those hardlinks
        # are ORDERED BEFORE their targets in the archive, which means:
        #   - VM-side `tar -xzf openclaw.tgz` extracts the hardlink as a
        #     stub before the target file exists → file ends up missing
        #     on disk → gateway crashes with ERR_MODULE_NOT_FOUND.
        #   - Re-extracting on the runner with `tar -xzf` ALSO fails for
        #     the same reason — can't unpack to repack.
        #
        # Fix: rewrite the tarball in-place using Python's `tarfile`,
        # which can resolve hardlinks at read-time (it reads the target
        # member by name, regardless of stream order). Each hardlink
        # entry becomes a regular file with the target's content.
        run: |
          npm pack --silent --pack-destination .
          mv openclaw-*.tgz openclaw-with-hardlinks.tgz
          python3 - <<'PY'
          import tarfile, sys
          src_path = "openclaw-with-hardlinks.tgz"
          dst_path = "openclaw.tgz"
          rewritten = 0
          with tarfile.open(src_path, "r:gz") as src, tarfile.open(dst_path, "w:gz") as dst:
              for entry in src:
                  if entry.islnk():
                      try:
                          target = src.getmember(entry.linkname)
                      except KeyError:
                          print(f"WARN: hardlink target missing: {entry.name} -> {entry.linkname}", file=sys.stderr)
                          dst.addfile(entry)
                          continue
                      entry.type = tarfile.REGTYPE
                      entry.size = target.size
                      data = src.extractfile(target)
                      dst.addfile(entry, data)
                      rewritten += 1
                  elif entry.isfile():
                      dst.addfile(entry, src.extractfile(entry))
                  else:
                      dst.addfile(entry)
          print(f"rewrote {rewritten} hardlinks as regular files")
          PY
          rm -f openclaw-with-hardlinks.tgz
          ls -lh openclaw.tgz
          # Verify by extracting — the only test that actually mirrors what
          # the VM-side install does. Counts files extracted as a sanity
          # gate against future regressions where hardlink targets are
          # silently dropped. Note: pi-agent-core/dist/types.js is a
          # TypeScript types-only file ("export {};") — its real content
          # is ~44 bytes, so don't add a size threshold here.
          mkdir -p _verify
          # tar exits 2 because of "Skipping to next header" warnings on the
          # rewritten hardlink entries. Extraction still completes correctly;
          # silence stderr and ignore exit code, then validate by inspection.
          tar -xzf openclaw.tgz -C _verify 2>/dev/null || true
          if [ ! -s _verify/package/node_modules/@mariozechner/pi-agent-core/dist/types.js ]; then
            echo "ERROR: pi-agent-core/dist/types.js missing or empty after extraction" >&2
            exit 1
          fi
          file_count=$(find _verify/package -type f | wc -l)
          echo "verify: extracted $file_count files; canary types.js OK ($(wc -c < _verify/package/node_modules/@mariozechner/pi-agent-core/dist/types.js) bytes)"
          if [ "$file_count" -lt 30000 ]; then
            echo "ERROR: only $file_count files extracted, expected 30000+" >&2
            exit 1
          fi
          rm -rf _verify

      - name: Create GitHub Release and upload tarball
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: openclaw.tgz
